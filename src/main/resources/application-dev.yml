# Perfil de desenvolvimento local: H2 persistente em arquivo e Keycloak via Docker Compose (porta 8180)
spring:
  datasource:
    url: jdbc:h2:file:./dados/tarefas
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/tarefas

logging:
  level:
    com.task.task_backend: INFO
